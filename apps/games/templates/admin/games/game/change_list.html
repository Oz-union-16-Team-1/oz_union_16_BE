{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<style>
  .actions label {
    display: none;
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".actions").forEach(function (actions) {
      var label = actions.querySelector("label");
      var select = actions.querySelector('select[name="action"]');
      var runButton = actions.querySelector('button[type="submit"], input[type="submit"]');

      if (label && select && label.contains(select)) {
        actions.insertBefore(select, label);
        label.remove();
      } else if (label) {
        label.remove();
      }

      if (select) {
        var firstActionOption = select.querySelector('option:not([value=""])');
        if (firstActionOption) {
          select.value = firstActionOption.value;
        }

        var emptyOption = select.querySelector('option[value=""]');
        if (emptyOption) {
          emptyOption.remove();
        }
      }

      if (runButton) {
        if (runButton.tagName === "INPUT") {
          runButton.value = "확인";
        } else {
          runButton.textContent = "확인";
        }
      }
    });
  });
</script>
{% endblock %}
