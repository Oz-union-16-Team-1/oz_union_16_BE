services:
  django:
    container_name: pgti_django
    env_file:
      - envs/.local.env
    build:
      context: .
    working_dir: /oz_union_16_BE
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --workers 3 --bind 0.0.0.0:8000 config.wsgi:application"
    ports:
      - "8000:8000"
    volumes:
      - .:/oz_union_16_BE
      - static_volume:/oz_union_16_BE/static
      - media_volume:/oz_union_16_BE/media
    networks:
      - ws
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: pgti_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/oz_union_16_BE/static
      - media_volume:/oz_union_16_BE/media
    networks:
      - ws

  db:
    image: pgvector/pgvector:pg14
    container_name: pgti_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgti1234
      POSTGRES_ROOT_USER: postgres
      POSTGRES_DB: oz_combined_PGTI
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ws
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:latest
    container_name: pgti_redis
    ports:
      - "6379:6379"
    networks:
      - ws
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  ws:
    driver: bridge

volumes:
  static_volume:
  media_volume:
  postgres_data:
