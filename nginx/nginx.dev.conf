events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 파일 업로드 용량 제한
    client_max_body_size 30M;

    # 전송 효율을 위한 Gzip 설정
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_vary on;

    upstream django_server {
        # Docker Compose의 서비스 이름이 django여야 합니다.
        server django:8000;
    }

    server {
        listen 80;
        # 도메인이 없으므로 EC2의 퍼블릭 IP 주소를 적습니다.
        # 탄력적 IP를 사용 중이라면 그 IP를 적으세요.
        server_name localhost;

        # 1. 정적 파일 직접 서빙 (성능 최적화)
        # 프로젝트 구조에 맞춰 oz_union_16_BE 경로 사용
        location /static/ {
            alias /oz_union_16_BE/static/;
            expires 30d; # 브라우저 캐싱 추가
            add_header Cache-Control "public";
        }

        # 2. 미디어 파일 직접 서빙
        location /media/ {
            alias /oz_union_16_BE/media/;
        }

        # 3. API 요청 전달
        location /api/ {
            proxy_pass http://django_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
        }

        # 4. Admin 요청 전달
        location /admin/ {
            proxy_pass http://django_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. 지정되지 않은 경로는 404 처리 (보안)
        location / {
            return 404;
        }
    }
}