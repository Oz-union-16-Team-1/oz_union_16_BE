user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 로그 포맷 설정
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 파일 업로드 용량 제한 (이미지 업로드 등을 고려)
    client_max_body_size 30M;

    # Gzip 압축 설정 (성능 최적화)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream django_server {
        server django:8000;
    }

    # 1. HTTP 요청을 HTTPS로 리다이렉트
    server {
        listen 80;
        server_name oz-pgti.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS 설정
    server {
        listen 443 ssl;
        server_name oz-pgti.duckdns.org;

        # 인증서 경로 (발급 후 생성됨)
        ssl_certificate /etc/letsencrypt/live/oz-pgti.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oz-pgti.duckdns.org/privkey.pem;

        # 보안 설정 (권장)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /static/ {
            alias /oz_union_16_BE/static/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /oz_union_16_BE/media/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://django_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃 설정 추가 (권장: 대형 요청이나 느린 쿼리 대비)
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }
    }
}