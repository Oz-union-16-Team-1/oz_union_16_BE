name: Production Server Deployment

on:
  pull_request:
    types: ['closed']
    branches:
      - main

jobs:
  prod_deploy:
    # PR이 머지되었을 때만 실행
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. GitHub Actions 러너의 현재 퍼블릭 IP 가져오기
      - name: Get GitHub Actions IP
        id: ip
        run: echo "ipv4=$(curl -s https://ifconfig.me)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:django-prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:django-prod
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:nginx-prod -f ./nginx/prod.Dockerfile ./nginx
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:nginx-prod

      # 2. AWS 자격 증명 설정 (리전: ap-southeast-2)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 3. AWS 보안 그룹에 GitHub IP 일시 허용 (리전 명시 필수)
      - name: Add GitHub IP to AWS Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
          --group-id ${{ secrets.AWS_SG_ID }} \
          --protocol tcp --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
          --region ap-southeast-2

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_PROD_USER }}
          key: ${{ secrets.EC2_PROD_SSH_KEY }}
          script: |
            sudo rm -f ${{ secrets.ENV_FILE_NAME }}
            echo "${{ secrets.DJANGO_PROD_ENVS }}" >> ${{ secrets.ENV_FILE_NAME }}
            
            for VOLUME in static-volume media-volume; do
              if ! docker volume inspect "$VOLUME" > /dev/null 2>&1; then
                docker volume create "$VOLUME"
              fi
            done
            
            docker stop ${{ secrets.DJANGO_CONTAINER_NAME }} || true
            docker rm ${{ secrets.DJANGO_CONTAINER_NAME }} || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:django-prod
            docker run -d \
              --name django \
              --network ws \
              -v static-volume:/oz_union_16_BE/static \
              -v media-volume:/oz_union_16_BE/media \
              -p 8000:8000 \
              --env-file ${{ secrets.ENV_FILE_NAME }} \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:django-prod \
              sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --workers 3 --bind