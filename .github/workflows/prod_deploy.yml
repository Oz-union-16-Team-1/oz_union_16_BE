name: Production Server Deployment

on:
  pull_request:
    types: ['closed']
    branches:
      - main

jobs:
  prod_deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. GitHub Actions 러너의 현재 퍼블릭 IP 가져오기
      - name: Get GitHub Actions IP
        id: ip
        run: echo "ipv4=$(curl -s https://ifconfig.me)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:django-prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:django-prod
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:nginx-prod -f ./nginx/prod.Dockerfile ./nginx
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:nginx-prod

      # 2. AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 3. AWS 보안 그룹에 GitHub IP 일시 허용
      - name: Add GitHub IP to AWS Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
          --group-id ${{ secrets.AWS_SG_ID }} \
          --protocol tcp --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
          --region ap-southeast-2

      # 4. SSH 접속 및 배포 (에러 수정 버전)
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_PROD_USER }}
          key: ${{ secrets.EC2_PROD_SSH_KEY }}
          script: |
            # 1. 환경 변수 파일 생성 (따옴표 에러 방지를 위해 cat 사용)
            sudo rm -f ${{ secrets.ENV_FILE_NAME }}
            cat <<EOF > ${{ secrets.ENV_FILE_NAME }}
            ${{ secrets.DJANGO_PROD_ENVS }}
            EOF
            
            # 2. 도커 네트워크 및 볼륨 생성
            docker network create ws || true
            docker volume create static-volume || true
            docker volume create media-volume || true
            
            # 3. Django 배포
            docker stop django || true
            docker rm django || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:django-prod
            docker run -d \
              --name django \
              --network ws \
              -v static-volume:/oz_union_16_BE/static \
              -v media-volume:/oz_union_16_BE/media \
              -p 8000:8000 \
              --env-file ${{ secrets.ENV_FILE_NAME }} \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:django-prod \
              sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --workers 3 --bind 0.0.0.0:8000 config.wsgi:application"
            
            # 4. Nginx 배포
            docker stop nginx || true
            docker rm nginx || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:nginx-prod
            docker run -d \
              --name nginx \
              --network ws \
              -v static-volume:/oz_union_16_BE/static \
              -v media-volume:/oz_union_16_BE/media \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:nginx-prod
            
            docker image prune -af

      # 5. AWS 보안 그룹에서 GitHub IP 삭제 (실패해도 실행)
      - name: Remove GitHub IP from AWS SG
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 \
            --region ap-southeast-2