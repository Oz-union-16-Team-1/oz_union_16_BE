name: Code Quality Checks

on:
  pull_request:
    branches:
      - "main"
      - "develop"
      - "release"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v3 -> v4 업데이트 권장

      - name: Install uv
        uses: astral-sh/setup-uv@v5 # uv 공식 액션 사용
        with:
          enable-cache: true # 종속성 및 uv 자체 캐싱 자동 활성화
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14 # uv를 통한 파이썬 설치

      - name: Install dependencies
        run: uv sync --frozen # uv.lock 기반으로 동기화 (poetry install과 유사)

      - name: Run isort (Import sorting)
        run: |
          uv run isort . --check --diff

      - name: Run black (Code formatting)
        run: |
          uv run black . --check

      - name: Set multiline environment variable
        run: |
          mkdir envs
          echo "${{ secrets.DJANGO_ENVS }}" >> envs/.local.env

      - name: Run Mypy
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg14
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pgti1234
          POSTGRES_DB: oz_combined_PGTI
          TZ: Asia/Seoul
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set multiline environment variable
        run: |
          mkdir envs
          echo "${{ secrets.DJANGO_ENVS }}" >> envs/.local.env

      - name: Run Django Migration
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_HOST: localhost

        run: |
          uv run python manage.py migrate

      - name: Check each app has test & Run coverage
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pgti1234
          POSTGRES_DB: oz_combined_PGTI
        run: |
          ran_tests=false
          apps=$(find apps -maxdepth 1 -mindepth 1 -type d -exec basename {} \;)
      
          for app_name in $apps; do
            app_path="apps/$app_name"
            test_files=$(find "$app_path" -type f \( -name "tests.py" -o -name "test_*.py" \))
            if [ -n "$test_files" ] && grep -q "def test_" $test_files 2>/dev/null; then
              echo "✅ Running tests for $app_name"
              # uv run으로 커버리지 실행
              uv run coverage run --source="$app_path" --append manage.py test "apps.$app_name"
              ran_tests=true
              echo "📊 Coverage for $app_name:"
              uv run coverage report -m --include="$app_path/*"
              echo ""
            else
              echo "⚠️  No test functions found in $app_name"
            fi
          done
      
          if [ "$ran_tests" = true ]; then
            echo "======================="
            echo "📊 Total Coverage Report:"
            uv run coverage report -m
          else
            echo "🚫 No tests were run. Skipping coverage report."
          fi